<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>To-Do List</h1>
        <p class="subtitle">Catat tugasmu dan jangan sampai lupa!</p>

        <div class="input-area">
            <input type="text" id="taskInput" placeholder="Masukkan tugas...">

            <button id="addButton">Tambah</button>
        </div>

        <div class="info">
            <span id="taskCount">0 tugas</span>
        </div>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
